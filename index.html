<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced PDF Annotator</title>
    
    <!-- PWA Manifest & Mobile Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6c152b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/337/337946.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Fonts for Splash Screen -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- PDF.js for rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- jsPDF for template generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- pdf-lib for document manipulation -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <style>
        /* FLUID SCALING */
        html {
            font-size: clamp(10px, 1vw + 0.5rem, 16px);
        }

        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Custom Scrollbar - WIDER FOR TOUCH */
        ::-webkit-scrollbar { width: 12px; height: 12px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
        .dark ::-webkit-scrollbar-thumb { background-color: #4b5563; }
        ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb:hover { background-color: #6b7280; }

        /* Splash Screen Animation - Fast Pop-in */
        @keyframes splashPop {
            0% { transform: scale(0.95); opacity: 0; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-splash {
            animation: splashPop 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Canvas Wrapper Setup */
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            margin: auto;
            cursor: none; 
            transform-origin: top center;
            touch-action: none;
        }
        
        /* Layer Stacking - Target ONLY main canvases to allow right sidebar thumbnail scrolling */
        #canvas-wrapper canvas { 
            position: absolute; top: 0; left: 0; 
            touch-action: none; 
        }
        #pdf-render { z-index: 1; }
        #annotation-layer { z-index: 2; cursor: none; }
        #laser-layer { z-index: 3; cursor: none; pointer-events: auto; }

        /* Text Layer & Input Styling */
        [contenteditable="true"]:empty:before {
            content: "Type here...";
            color: #9ca3af;
            pointer-events: none;
            display: block;
        }

        /* Styling custom cursors and inputs */
        #custom-cursor {
            position: fixed; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); display: none;
            align-items: center; justify-content: center;
        }
        #cursor-circle {
            border-radius: 50%; border: 2px solid; position: absolute; box-sizing: border-box;
        }
        #cursor-emoji {
            position: absolute; font-size: 1rem;
            transform: translate(15px, -15px); text-shadow: 0 0 2px rgba(255,255,255,0.8);
        }
        .dark #cursor-emoji { text-shadow: 0 0 2px rgba(0,0,0,0.8); }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; border: 1px solid #cbd5e1; }
        .dark input[type="color"]::-webkit-color-swatch { border-color: #4b5563; }
        
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(255, 255, 255, 0.9);
            z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .dark #loading-overlay { background: rgba(17, 24, 39, 0.9); }

        @media (max-width: 768px) {
            #sidebar, #right-sidebar { position: absolute; height: 100%; box-shadow: 2xl; z-index: 50; }
            #sidebar { left: 0; }
            #right-sidebar { right: 0; }
        }
    </style>
</head>

<body class="flex h-screen w-screen text-sm bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-200">

    <!-- Splash Screen (HTML/CSS Based) -->
    <div id="welcome-splash" class="fixed inset-0 z-[10005] bg-black/20 dark:bg-black/60 backdrop-blur-sm flex items-center justify-center transition-opacity duration-300 p-4">
        <div class="relative flex flex-col items-center justify-center animate-splash w-full max-w-3xl aspect-[16/9] bg-[#f7f5ef] dark:bg-gray-900 rounded-[3rem] shadow-2xl border border-gray-200 dark:border-gray-800 overflow-hidden">
            <!-- Background PDF Icon -->
            <div class="absolute inset-0 flex items-center justify-center opacity-[0.15] dark:opacity-10 pointer-events-none">
                <i class="ph ph-file-text text-[24rem] text-gray-400"></i>
            </div>
            
            <!-- Main Splash Content -->
            <div class="relative z-10 flex flex-col items-center -mt-6">
                <div class="flex items-end">
                    <h1 style="font-family: 'Dancing Script', cursive;" class="text-8xl md:text-[8rem] font-bold text-[#6c152b] dark:text-[#a82d4f] leading-none drop-shadow-sm pb-2">
                        Marc-oP
                    </h1>
                    <i class="ph-fill ph-pen-nib text-5xl md:text-6xl text-gray-800 dark:text-gray-200 mb-8 ml-2 -rotate-45 drop-shadow-md"></i>
                </div>
                <div class="h-0.5 w-[110%] bg-[#6c152b]/20 dark:bg-[#a82d4f]/30 rounded-full mt-2 mb-4"></div>
                <p class="text-[#6c152b] dark:text-[#a82d4f] font-bold tracking-[0.2em] text-sm md:text-lg uppercase">
                    PDF Reader & Annotation Tool
                </p>
                <!-- Added Credit Text -->
                <p class="mt-6 text-xs md:text-sm text-gray-600 dark:text-gray-400 font-medium tracking-wide">
                    Created by Marco Paladino &amp; Jordan Knarr
                </p>
            </div>
        </div>
    </div>

    <div id="custom-cursor">
        <div id="cursor-circle"></div>
        <div id="cursor-emoji">🖊️</div>
    </div>

    <div id="loading-overlay">
        <i class="ph ph-spinner animate-spin text-4xl mb-4 text-indigo-500"></i>
        <div id="loading-text" class="text-lg font-semibold text-gray-800 dark:text-gray-200">Processing...</div>
    </div>

    <!-- General Message Modal -->
    <div id="message-modal" class="fixed inset-0 bg-black/50 z-[10001] hidden items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-gray-200 dark:border-gray-800 flex flex-col items-center text-center">
            <i id="modal-icon" class="ph ph-warning-circle text-4xl text-amber-500 mb-3"></i>
            <h3 id="modal-title" class="text-lg font-bold mb-2">Notice</h3>
            <p id="modal-text" class="text-gray-600 dark:text-gray-400 mb-6 text-sm">Message goes here.</p>
            <button id="modal-btn" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium transition-colors">OK</button>
        </div>
    </div>

    <!-- Lined Paper Type Selection Modal -->
    <div id="lined-modal" class="fixed inset-0 bg-black/50 z-[10001] hidden items-center justify-center backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border border-gray-200 dark:border-gray-800 flex flex-col items-center text-center">
            <i class="ph ph-list-dashes text-4xl text-sky-500 mb-3"></i>
            <h3 class="text-lg font-bold mb-4">Choose Lined Paper Type</h3>
            <div class="w-full flex flex-col gap-3">
                <button id="btn-standard-lined" class="w-full py-2.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded-lg font-medium transition-colors text-gray-800 dark:text-gray-200 flex items-center justify-center gap-2">
                    <i class="ph ph-rows text-lg"></i> Wide Lined Paper
                </button>
                <button id="btn-handwriting-lined" class="w-full py-2.5 bg-sky-100 hover:bg-sky-200 dark:bg-sky-900/40 dark:hover:bg-sky-900/60 rounded-lg font-medium transition-colors text-sky-800 dark:text-sky-300 flex items-center justify-center gap-2 border border-sky-200 dark:border-sky-800">
                    <i class="ph ph-text-aa text-lg"></i> Primary Paper
                </button>
                <button id="btn-cancel-lined" class="w-full py-2 mt-2 text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 font-medium transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <aside id="sidebar" class="w-[16.5rem] bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 flex flex-col z-20 shrink-0 shadow-lg transition-all duration-300 ease-in-out">
        <div class="md:hidden p-3 border-b border-gray-200 dark:border-gray-800 flex justify-end">
            <button id="btn-close-sidebar-mobile" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>

        <div class="p-3 flex-1 flex flex-col gap-3 overflow-y-auto mt-2">
            
            <div class="p-3 border border-gray-200 dark:border-gray-800 rounded-xl flex flex-col">
                <label for="file-upload" class="flex items-center justify-center gap-2 w-full px-4 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg cursor-pointer transition-colors font-medium shadow-md">
                    <i class="ph ph-upload-simple text-lg"></i> Open PDF
                </label>
                <input id="file-upload" type="file" accept="application/pdf" class="hidden" />
                <p id="file-name" class="text-xs text-gray-500 dark:text-gray-400 truncate mt-2 text-center">No file selected</p>
            </div>

            <!-- Templates Section -->
            <div class="flex flex-col gap-2 p-3 border border-gray-200 dark:border-gray-800 rounded-xl">
                <select id="template-bg-color" class="w-full bg-gray-50 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-md px-2 py-1.5 text-gray-900 dark:text-white text-xs focus:outline-none focus:border-indigo-500">
                    <option value="#ffffff">White Paper</option>
                    <option value="#fef08a">Yellow Paper</option>
                    <option value="#bae6fd">Blue Paper</option>
                    <option value="#2a3b2e">Chalkboard</option>
                </select>

                <div class="grid grid-cols-3 gap-2">
                    <button class="template-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 bg-emerald-100 hover:bg-emerald-50 dark:bg-emerald-900/30 dark:hover:bg-emerald-800/50 rounded-lg border border-emerald-200 dark:border-emerald-800 transition-colors" data-type="graph">
                        <i class="ph ph-grid-four text-lg text-emerald-600 dark:text-emerald-400"></i>
                        <span class="text-[10px] font-medium text-center text-emerald-800 dark:text-emerald-300 leading-none">Graph</span>
                    </button>
                    <button class="template-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 bg-sky-100 hover:bg-sky-50 dark:bg-sky-900/30 dark:hover:bg-sky-800/50 rounded-lg border border-sky-200 dark:border-sky-800 transition-colors" data-type="lined">
                        <i class="ph ph-list-dashes text-lg text-sky-600 dark:text-sky-400"></i>
                        <span class="text-[10px] font-medium text-center text-sky-800 dark:text-sky-300 leading-none">Lined</span>
                    </button>
                    <button class="template-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 bg-fuchsia-100 hover:bg-fuchsia-50 dark:bg-fuchsia-900/30 dark:hover:bg-fuchsia-800/50 rounded-lg border border-fuchsia-200 dark:border-fuchsia-800 transition-colors" data-type="music">
                        <i class="ph ph-music-notes text-lg text-fuchsia-600 dark:text-fuchsia-400"></i>
                        <span class="text-[10px] font-medium text-center text-fuchsia-800 dark:text-fuchsia-300 leading-none">Music</span>
                    </button>
                </div>
            </div>

            <!-- Tools Section (3x3 Grid) -->
            <div class="flex flex-col gap-2 p-3 border border-gray-200 dark:border-gray-800 rounded-xl">
                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-pan" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-400 transition-all border-2 border-transparent" data-tool="pan">
                        <span class="text-lg">🖐️</span>
                        <span class="text-[10px] font-medium text-center leading-none">Pan</span>
                    </button>
                    <button id="btn-text" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg transition-all border-2 border-transparent" data-tool="text">
                        <span class="text-lg">🔤</span>
                        <span class="text-[10px] font-medium text-center leading-none">Text</span>
                    </button>
                    <button id="btn-pen" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg transition-all border-2 border-transparent" data-tool="pen">
                        <span class="text-lg">🖊️</span>
                        <span class="text-[10px] font-medium text-center leading-none">Pen</span>
                    </button>
                    <button id="btn-eraser" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg transition-all border-2 border-transparent" data-tool="eraser">
                        <span class="text-lg">🧽</span>
                        <span class="text-[10px] font-medium text-center leading-none">Eraser</span>
                    </button>
                    <button id="btn-laser" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg transition-all border-2 border-transparent" data-tool="laser">
                        <span class="text-lg">🪄</span>
                        <span class="text-[10px] font-medium text-center leading-none">Laser</span>
                    </button>
                    <button id="btn-shape" class="tool-btn flex flex-col items-center justify-center gap-1 py-1.5 px-1 rounded-lg transition-all border-2 border-transparent" data-tool="shape">
                        <span class="text-lg">🔲</span>
                        <span class="text-[10px] font-medium text-center leading-none">Shapes</span>
                    </button>
                </div>

                <div id="shape-settings" class="hidden flex-col gap-2">
                    <label class="text-xs text-gray-500 dark:text-gray-400">Shape Type</label>
                    <select id="shape-type" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-md px-2 py-2 text-gray-900 dark:text-white text-xs focus:outline-none focus:border-indigo-500">
                        <option value="rectangle">Rectangle</option>
                        <option value="square">Square</option>
                        <option value="circle">Circle</option>
                        <option value="ellipse">Ellipse</option>
                        <option value="pixelate">Pixelate</option>
                    </select>

                    <div id="fill-opacity-settings" class="flex flex-col gap-1 mt-1">
                        <div class="flex justify-between items-center">
                            <label class="text-xs text-gray-500 dark:text-gray-400">Fill Opacity</label>
                            <span id="opacity-val" class="text-xs font-mono text-gray-900 dark:text-white">0%</span>
                        </div>
                        <input type="range" id="opacity-slider" min="0" max="100" value="0" class="w-full h-2 bg-gray-300 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>

                    <div id="pixelate-settings" class="hidden flex-col gap-2 mt-2 bg-gray-100 dark:bg-gray-800/50 p-2 rounded-lg border border-gray-200 dark:border-gray-700">
                        <div class="flex justify-between items-center">
                            <label class="text-xs text-gray-500 dark:text-gray-400">Pixel Size</label>
                            <span id="pixel-val" class="text-xs font-mono text-gray-900 dark:text-white">10px</span>
                        </div>
                        <input type="range" id="pixel-slider" min="2" max="50" value="10" class="w-full h-2 bg-gray-300 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                </div>

                <div id="thickness-settings" class="flex flex-col gap-2 mt-1">
                    <div class="flex justify-between items-center">
                        <label id="thickness-label" class="text-xs text-gray-500 dark:text-gray-400">Thickness (px)</label>
                        <input type="number" id="thick-input" min="1" max="100" value="5" class="w-16 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-md px-2 py-1 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500 text-center transition-colors text-xs font-mono" />
                    </div>
                    <input type="range" id="thick-slider" min="1" max="100" value="5" class="w-full h-2 bg-gray-300 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>
            </div>

            <!-- Color Section -->
            <div class="flex flex-col gap-2 p-3 border border-gray-200 dark:border-gray-800 rounded-xl">
                <div id="color-palette" class="grid grid-cols-5 gap-2"></div>
                
                <input type="range" id="color-slider" min="0" max="360" value="45" class="w-full h-3 mt-1 rounded-lg appearance-none cursor-pointer outline-none shadow-sm" style="background: linear-gradient(to right, #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);">
                
                <div class="flex gap-2 h-9 mt-1">
                    <input type="color" id="color-picker" value="#eab308" class="w-12 h-full cursor-pointer p-0 border-0 bg-transparent rounded-md" />
                    <input type="text" id="color-hex" value="#eab308" class="flex-1 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-md px-3 text-gray-900 dark:text-white focus:outline-none focus:border-indigo-500 font-mono text-xs uppercase transition-colors" />
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col gap-2 mt-auto p-3 border border-gray-200 dark:border-gray-800 rounded-xl mb-2">
                <button id="btn-save-current-pdf" class="flex items-center justify-center gap-2 w-full px-4 py-2 text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition-colors border border-gray-200 dark:border-gray-700 whitespace-nowrap">
                    <i class="ph ph-file-pdf"></i> Save current page
                </button>
                <button id="btn-save-pdf" class="flex items-center justify-center gap-2 w-full px-4 py-3 text-white bg-green-600 hover:bg-green-500 shadow-md rounded-lg transition-colors font-medium whitespace-nowrap">
                    <i class="ph ph-export"></i> Save full as PDF
                </button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative min-w-0 bg-gray-100 dark:bg-gray-950 transition-colors duration-200 overflow-hidden">
        
        <header class="min-h-[3.5rem] py-1.5 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 grid grid-cols-[auto_1fr_auto] md:grid-cols-3 px-4 shrink-0 z-10 transition-colors duration-200 relative shadow-sm">
            <div class="flex items-center gap-2 justify-self-start">
                <button id="btn-toggle-sidebar" class="p-2 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors" title="Toggle Tools">
                    <i class="ph ph-list text-xl"></i>
                </button>
                <button id="theme-toggle" class="p-2 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-300 transition-colors ml-2" title="Toggle Light/Dark Mode">
                    <i class="ph ph-moon text-xl dark:hidden"></i>
                    <i class="ph ph-sun text-xl hidden dark:block"></i>
                </button>
            </div>

            <div class="flex flex-col items-center justify-center gap-1 justify-self-center w-full px-2">
                <div class="flex items-center justify-center gap-1 md:gap-4">
                    <button id="zoom-out" class="p-1 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"><i class="ph ph-minus"></i></button>
                    <span id="zoom-val" class="text-[0.7rem] md:text-xs font-mono w-10 md:w-12 text-center text-gray-600 dark:text-gray-400">100%</span>
                    <input type="range" id="zoom-slider" min="0.5" max="3" step="0.05" value="1" class="w-14 md:w-28 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    <button id="zoom-in" class="p-1 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"><i class="ph ph-plus"></i></button>
                </div>
                
                <button id="btn-fit-screen" class="hidden md:flex items-center gap-1 px-3 py-0.5 rounded bg-transparent hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 hover:text-indigo-600 dark:hover:text-indigo-400 text-[10px] font-medium transition-colors whitespace-nowrap">
                    <i class="ph ph-corners-out"></i> Fit to screen
                </button>
            </div>
            
            <div class="flex items-center gap-1 md:gap-2 justify-self-end">
                <button id="btn-rotate-ccw" class="p-1.5 md:p-2 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors" title="Rotate Left">
                    <i class="ph ph-arrow-counter-clockwise text-lg md:text-xl"></i>
                </button>
                <button id="btn-rotate-cw" class="p-1.5 md:p-2 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors" title="Rotate Right">
                    <i class="ph ph-arrow-clockwise text-lg md:text-xl"></i>
                </button>
                <div class="w-px h-6 bg-gray-300 dark:bg-gray-700 mx-0.5 md:mx-1"></div>
                <button id="btn-toggle-pages" class="p-1.5 md:p-2 rounded bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300 transition-colors" title="Toggle Pages">
                    <i class="ph ph-files text-lg md:text-xl"></i>
                </button>
            </div> 
        </header>

        <div id="main-scroll" class="flex-1 overflow-auto relative p-4 md:p-8 flex items-start justify-center">
            <div id="empty-state" class="m-auto flex flex-col items-center gap-4 text-gray-500 dark:text-gray-600 mt-20">
                <i class="ph ph-file-pdf text-6xl opacity-40"></i>
                <p>Upload a PDF, add a blank page, or select a template</p>
            </div>

            <div id="canvas-wrapper" style="display: none;">
                <canvas id="pdf-render"></canvas>
                <canvas id="annotation-layer"></canvas>
                <canvas id="laser-layer"></canvas>
                <!-- Dedicated interactive layer for text -->
                <div id="text-layer" class="absolute inset-0 z-[4] pointer-events-none"></div>
            </div>
        </div>

        <footer class="h-14 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 flex items-center justify-between px-2 md:px-6 shrink-0 z-10 transition-colors duration-200">
            <div class="flex gap-1 md:gap-2">
                <button id="btn-add-page" class="px-2 md:px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded flex items-center gap-1 transition-colors text-xs font-semibold whitespace-nowrap">
                    <i class="ph ph-plus-circle text-base md:text-lg"></i> <span class="hidden md:inline">Add</span>
                </button>
                <button id="btn-remove-page" class="px-2 md:px-3 py-1.5 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 rounded flex items-center gap-1 transition-colors text-xs font-semibold whitespace-nowrap">
                    <i class="ph ph-minus-circle text-base md:text-lg"></i> <span class="hidden md:inline">Remove</span>

            <div class="flex items-center gap-2 md:gap-6">
                <button id="page-prev" class="px-2 md:px-4 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1 md:gap-2 transition-colors">
                    <i class="ph ph-caret-left"></i> <span class="hidden md:inline">Prev</span>

                <span class="text-xs md:text-sm text-gray-500 dark:text-gray-400 font-medium whitespace-nowrap"><span class="hidden md:inline">Page </span><span id="page-num" class="text-gray-900 dark:text-white">0</span> / <span id="page-count" class="text-gray-900 dark:text-white">0</span></span>
                <button id="page-next" class="px-2 md:px-4 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 rounded text-gray-700 dark:text-gray-300 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-1 md:gap-2 transition-colors">
                    <span class="hidden md:inline">Next</span> <i class="ph ph-caret-right"></i>

            <div class="flex gap-1 md:gap-2">
                <button id="btn-undo" class="px-2 md:px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-900/30 dark:hover:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 rounded flex items-center gap-1 transition-colors text-xs font-semibold whitespace-nowrap" title="Undo">
                    <i class="ph ph-arrow-u-up-left text-base md:text-lg"></i> <span class="hidden md:inline">Undo</span>
                </button>
                <button id="btn-clear" class="px-2 md:px-3 py-1.5 bg-red-50 hover:bg-red-100 dark:bg-red-900/30 dark:hover:bg-red-900/50 text-red-600 dark:text-red-400 rounded flex items-center gap-1 transition-colors text-xs font-semibold whitespace-nowrap" title="Clear Page">
                    <i class="ph ph-trash text-base md:text-lg"></i> <span class="hidden md:inline">Clear</span>
